# HBOT physical geometry - the ONE place to edit a robot dimension.
#
# Read by urdf/hbot.urdf.xacro (xacro.load_yaml), so the real-robot and the
# Gazebo descriptions always share these numbers. Units: metres, radians, kg.
#
# `cad` means "use the value measured from the CAD", i.e. the matching
# property in urdf/cad_params.xacro (generated by scripts/prepare_meshes.py).
# Replace it with a number only when you have measured the real robot, and
# note where the number came from.
#
# The hbot_driver parameters (hbot_bringup/config/yahboom_driver_params.yaml:
# wheel_track, wheel_diameter) must describe the same wheels - see
# README.md, "Step 9: Follow-ups outside this package".

wheels:
  track: 0.190        # tyre centre to tyre centre, measured on the robot (CAD: 0.1827)
  radius: 0.03375         # 0.0337 in the CAD
  width: 0.0265          # 0.0306 in the CAD

caster:
  x: cad              # ball centre, forward of the drive axle
  y: cad
  radius: cad

laser:                # `laser` frame = YDLidar X3 head centre on the scan plane
  x: cad
  y: cad
  z: cad
  yaw: 0.0            # set to 3.14159 if /scan appears rotated 180 deg on the real robot

imu:                  # Rosmaster board IMU (`imu_link`)
  x: 0.0
  y: 0.0
  z: 0.0

mass:                 # estimates; kept from the previous box model so the tuned
  base: 0.5           # Gazebo diff-drive behaviour does not change
  wheel: 0.1
  lidar: 0.1

lidar_sensor:         # YDLidar X3: 3 kHz sampling / 8 Hz scan = 375 samples per turn
  rate: 8.0
  samples: 375
  range_min: 0.12
  range_max: 8.0
  noise_stddev: 0.01
